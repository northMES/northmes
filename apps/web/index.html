<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading · NorthMES</title>
    <!--
      The stylesheet and the stored theme apply before the first paint, so the boot page never
      shows unstyled (design shell-306, BO1 and BO2). Vite serves app.css in dev and writes the
      hashed stylesheet in its place in the build. color-scheme makes the blank page follow the
      system theme while the stylesheet loads. vite-ignore leaves the theme script's tag to the
      theme-boot plugin in vite.config.ts, because Vite bundles module scripts only.
    -->
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/src/styles/app.css" />
    <script vite-ignore src="/src/boot/theme-boot.js"></script>
  </head>
  <body>
    <!--
      The boot page (design shell-306, BO1): it shows until the shell renders, which replaces
      everything in #root. Boot writes NorthMES could not start into the same layout (BO3, BO6).
    -->
    <div id="root">
      <div class="flex min-h-svh flex-col bg-background text-foreground">
        <a
          href="#main"
          class="sr-only z-50 rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground focus:not-sr-only focus:fixed focus:top-2 focus:left-2"
          >Skip to main content</a
        >
        <header class="flex h-14 items-center gap-2 border-b border-border px-4">
          <span
            aria-hidden="true"
            class="grid size-6 place-items-center rounded-md bg-primary text-xs font-semibold text-primary-foreground"
            >N</span
          >
          <span class="font-semibold">NorthMES</span>
        </header>
        <main
          id="main"
          tabindex="-1"
          aria-busy="true"
          class="flex flex-1 justify-center px-4 py-8 sm:py-24"
        >
          <div
            class="flex h-fit w-full max-w-150 flex-col gap-5 rounded-xl bg-card p-8 ring-1 ring-border max-sm:bg-transparent max-sm:p-0 max-sm:ring-0"
          >
            <h1 class="text-2xl font-semibold tracking-tight sm:text-[1.75rem] sm:leading-[2.125rem]">
              Loading NorthMES
            </h1>
            <p class="flex items-center gap-2 text-sm text-muted-foreground">
              <svg
                aria-hidden="true"
                width="16"
                height="16"
                class="size-4 animate-spin motion-reduce:animate-none"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
              </svg>
              Starting NorthMES in this browser.
            </p>
          </div>
        </main>
      </div>
    </div>
    <!-- announce() speaks here; outside #root, so it works while a modal is open (ADR 0021). -->
    <div id="announcer-polite" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
