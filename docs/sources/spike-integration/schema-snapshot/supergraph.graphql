schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION) {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__field(
  graph: join__Graph
  requires: join__FieldSet
  provides: join__FieldSet
  type: String
  external: Boolean
  override: String
  usedOverridden: Boolean
  overrideLabel: String
  contextArguments: [join__ContextArgument!]
) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(
  graph: join__Graph!
  key: join__FieldSet
  extension: Boolean! = false
  resolvable: Boolean! = true
  isInterfaceObject: Boolean! = false
) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

scalar join__FieldSet

scalar join__FieldValue

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

enum join__Graph {
  CORE @join__graph(name: "core", url: "inproc://core")
  PLANNING @join__graph(name: "planning", url: "inproc://planning")
}

type Article @join__type(graph: CORE, key: "id") @join__type(graph: PLANNING, key: "id") {
  id: ID!
  code: String! @join__field(graph: CORE)
  name: String! @join__field(graph: CORE)
}

type Query @join__type(graph: CORE) @join__type(graph: PLANNING) {
  coreArticle(id: ID!): Article @join__field(graph: CORE)
  planningProductionOrders(first: Int! = 25): ProductionOrderConnection! @join__field(graph: PLANNING)
}

type PageInfo @join__type(graph: PLANNING) {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ProductionOrder @join__type(graph: PLANNING, key: "id") {
  id: ID!
  number: String!
  plantId: ID!
  quantity: Int!
  status: String!
  version: Int!
  article: Article
}

type ProductionOrderEdge @join__type(graph: PLANNING) {
  cursor: String!
  node: ProductionOrder!
}

type ProductionOrderConnection @join__type(graph: PLANNING) {
  edges: [ProductionOrderEdge!]!
  pageInfo: PageInfo!
}

type PlanningBoardChange @join__type(graph: PLANNING) {
  plantId: ID!
  kind: String!
  productionOrder: ProductionOrder!
}

type Mutation @join__type(graph: PLANNING) {
  planningCreateProductionOrder(articleId: ID!, quantity: Int!): ProductionOrder!
  planningReleaseProductionOrder(id: ID!): ProductionOrder!
}

type Subscription @join__type(graph: PLANNING) {
  planningBoardChanged(plantId: ID!): PlanningBoardChange!
}