packages:
  - packages/*
  - apps/*
  - modules/*/web

# One version per shared singleton, used by the shell and every remote.
catalog:
  react: 19.3.0
  react-dom: 19.3.0
  "@tanstack/react-router": 1.170.41
  "@apollo/client": 4.3.1
  graphql: 16.14.2
  rxjs: 7.8.2
  vite: 8.3.2
  "@vitejs/plugin-react": 6.1.1
  "@module-federation/vite": 1.23.2
  "@module-federation/runtime": 2.9.2
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  typescript: 6.0.3
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0

minimumReleaseAgeExclude:
  - '@module-federation/vite@1.23.2'
  - data-urls@8.0.0
  - jsdom@30.1.2
  - tr46@7.0.0
  - whatwg-url@17.2.0
