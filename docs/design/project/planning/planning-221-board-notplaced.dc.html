<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D3 Not placed row</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" />
        <script src="https://unpkg.com/lucide@1.45.0/dist/umd/lucide.min.js" integrity="sha384-1K5mjRr9EvBwlp0ALeQf1DEysXoqYs+nRQmDBi/UrEty5RgCjPRph7NJZkRjAFWJ" crossorigin="anonymous"></script>
        <script src="./planning-221-board-data.js"></script>
        <link rel="stylesheet" href="../ui/tokens.css" />
        <link rel="stylesheet" href="../ui/ui-189-tokens-page.css" />
        <link rel="stylesheet" href="../shell/shell-190-navigation.css" />
        <link rel="stylesheet" href="./planning-221-board.css" />
      </helmet>
      <div class="{{ wrapCls }}" role="{{ wrapRole }}" aria-label="{{ wrapLabel }}" aria-rowcount="{{ wrapCount }}" lang="{{ lang }}" data-pbu="{{ uid }}">
        <div class="pb-row pinned" role="row" aria-rowindex="{{ ri }}">
          <div class="pb-rh" role="rowheader" aria-label="{{ rhLabel }}"><span class="ic" data-icon="Inbox"></span><span class="pb-mn">{{ title }}</span><sc-if value="{{ hasCount }}"><span class="pb-cnt">{{ count }}</span></sc-if></div>
          <div class="pb-lane">
            <div class="pb-pin">
              <sc-if value="{{ busy }}"><span class="pb-skr" style="width:96px;height:28px"></span><span class="pb-skr" style="width:96px;height:28px"></span></sc-if>
              <sc-for list="{{ chips }}" as="u" hint-placeholder-count="3"><span class="pb-chip {{ u.cls }}" role="gridcell" tabIndex="{{ u.ti }}" aria-selected="{{ u.sel }}" aria-label="{{ u.label }}"><span class="num">{{ u.j }}</span><span lang="{{ u.lang }}">{{ u.a }}</span></span></sc-for>
              <sc-if value="{{ hasMore }}"><span class="pb-chip more {{ moreCls }}" role="gridcell" tabIndex="{{ moreTi }}" aria-label="{{ moreLabel }}"><span>{{ moreText }}</span><span class="ic" data-icon="ArrowRight"></span></span></sc-if>
              <sc-if value="{{ none }}"><span class="pb-emp {{ noneCls }}" role="gridcell" tabIndex="{{ noneTi }}" style="position:static;transform:none">{{ noneText }}</span></sc-if>
            </div>
          </div>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"nested":{"editor":"enum","options":["off","on"],"default":"off","tsType":"string"},"size":{"editor":"enum","options":["wide","narrow"],"default":"wide","tsType":"string"},"state":{"editor":"enum","options":["default","many","empty"],"default":"default","tsType":"string"},"focus":{"editor":"text","default":"none","tsType":"string"},"stop":{"editor":"text","default":"none","tsType":"string"},"selected":{"editor":"text","default":"none","tsType":"string"},"strings":{"editor":"enum","options":["default","long"],"default":"default","tsType":"string"},"busy":{"editor":"enum","options":["false","true"],"default":"false","tsType":"string"},"ri":{"editor":"int","default":2,"tsType":"number"},"theme":{"editor":"enum","options":["inherit","dark"],"default":"inherit","tsType":"string"},"idp":{"editor":"text","default":"np","tsType":"string"}}'>
      class Component extends DCLogic {
        componentDidMount() {
          // Icons: the Shell's lucide filler, same flag, for a standalone render.
          if (!window.__nmIconFill2) {
            window.__nmIconFill2 = true;
            const fill = () => {
              const L = window.lucide;
              if (!L) return;
              document.querySelectorAll("[data-icon]").forEach((el) => {
                const name = el.getAttribute("data-icon");
                if (el.firstElementChild && el.getAttribute("data-icon-drawn") === name) return;
                const node = L.icons[name];
                if (!node) return;
                while (el.firstChild) el.removeChild(el.firstChild);
                el.appendChild(L.createElement(node, { "aria-hidden": "true", focusable: "false" }));
                el.setAttribute("data-icon-drawn", name);
              });
            };
            let queued = false;
            const schedule = () => {
              if (queued) return;
              queued = true;
              setTimeout(() => { queued = false; fill(); }, 0);
            };
            new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["data-icon"] });
            const wait = () => (window.lucide ? schedule() : setTimeout(wait, 100));
            wait();
          }
          const ready = () => (window.PB ? this.forceUpdate() : setTimeout(ready, 50));
          if (!window.PB) ready();
          // Measure the lane, so the chips that do not fit fold into the "N more" cell.
          this.__measure = () => {
            const root = document.querySelector('[data-pbu="' + this.__uid + '"]');
            const lane = root && root.querySelector(".pb-lane");
            if (!lane) return;
            const w = Math.round(lane.clientWidth);
            if (Math.abs(((this.state || {}).w || 0) - w) > 1) this.setState({ w });
          };
          setTimeout(this.__measure, 30);
          if (window.ResizeObserver) {
            this.__ro = new ResizeObserver(() => this.__measure());
            setTimeout(() => { const root = document.querySelector('[data-pbu="' + this.__uid + '"]'); if (root && this.__ro) this.__ro.observe(root); }, 0);
          }
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.__measure && this.__measure());
        }
        componentWillUnmount() {
          if (this.__ro) this.__ro.disconnect();
          this.__ro = null;
        }
        renderVals() {
          const p = this.props;
          this.__uid = this.__uid || "pbn" + Math.random().toString(36).slice(2, 9);
          const nested = p.nested === "on";
          const narrow = p.size === "narrow";
          const PB = window.PB;
          const wrapCls = "pb-np" + (nested ? " nested" : "") + (narrow ? " nar" : "") + (p.theme === "dark" ? " dark" : "");
          const base = { uid: this.__uid, wrapCls, wrapRole: nested ? undefined : "grid", ri: String(p.ri || 2), chips: [], title: "", count: "", noneText: "", moreText: "" };
          if (!PB) return base;
          const strings = p.strings === "long" ? "long" : "default";
          const T = PB.tr(strings);
          const state = p.state || "default";
          const busy = p.busy === "true";
          const focus = String(p.focus || "none");
          const sel = String(p.selected || "none");
          const items = state === "empty" || busy ? [] : state === "many" ? PB.NOTPLACED.concat(PB.MORE) : PB.NOTPLACED;
          const laneW = ((this.state || {}).w) || (narrow ? 190 : 620);
          // Chip width: job number in Plex Mono 700, the article in Plex Sans 12 px, 20 px padding, 6 px gap.
          const chipW = (u) => 7 * 7.6 + 6 + u.an.length * 6.6 + 22;
          const all = items.map((u) => { const an = PB.aName(u.a, strings); return { u, an: an.t, lang: an.lang }; });
          let used = 16, fit = 0;
          const moreW = 84;
          for (let i = 0; i < all.length; i++) {
            const w = chipW(all[i]) + 6;
            const needMore = i < all.length - 1;
            if (used + w + (needMore ? moreW : 0) > laneW) break;
            used += w;
            fit++;
          }
          if (fit < all.length && fit === all.length - 1 && used + chipW(all[fit]) <= laneW) fit = all.length;
          const shown = all.slice(0, fit);
          const rest = all.length - fit;
          // Roving tabindex inside the grid: the focused chip, else the selected chip.
          const stopKey = focus !== "none" ? focus : sel !== "none" ? sel : nested || !shown.length ? null : shown[0].u.j;
          const chips = shown.map((x) => {
            const isF = focus === x.u.j;
            const isS = sel === x.u.j;
            return { j: x.u.j, a: x.an, lang: x.lang, label: T.npName({ j: x.u.j, an: x.an, q: x.u.q }), sel: String(isS), ti: x.u.j === stopKey ? "0" : "-1", cls: (isF ? "is-focus " : "") + (isS ? "sel" : "") };
          });
          const moreF = focus === "more";
          const noneF = focus === "none-cell";
          // The grid passes stop="none-cell" when no job order is in view, so the empty row holds the grid's Tab stop (19.8).
          const noneStop = noneF || String(p.stop || "none") === "none-cell";
          return Object.assign(base, {
            lang: T.lang,
            wrapLabel: nested ? undefined : T.notPlaced,
            wrapCount: nested ? undefined : "1",
            title: T.notPlaced,
            count: String(items.length), hasCount: !busy,
            rhLabel: busy ? T.notPlaced : T.notPlacedN(items.length),
            busy,
            chips,
            hasMore: rest > 0, moreText: fit ? T.npMore(rest) : T.npAll(rest), moreLabel: fit ? T.npMoreName(rest) : T.npAllName(rest), moreCls: moreF ? "is-focus" : "", moreTi: moreF ? "0" : "-1",
            none: !busy && items.length === 0, noneText: T.npNone, noneCls: noneF ? "is-focus" : "", noneTi: noneStop ? "0" : "-1",
          });
        }
      }
    </script>
  </body>
</html>
