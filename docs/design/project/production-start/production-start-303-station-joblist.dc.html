<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D4 station job list</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" />
        <script src="https://unpkg.com/lucide@1.45.0/dist/umd/lucide.min.js" integrity="sha384-1K5mjRr9EvBwlp0ALeQf1DEysXoqYs+nRQmDBi/UrEty5RgCjPRph7NJZkRjAFWJ" crossorigin="anonymous"></script>
        <script src="./production-start-303-station-data.js"></script>
        <link rel="stylesheet" href="../ui/tokens.css" />
        <link rel="stylesheet" href="../ui/ui-189-tokens-page.css" />
        <link rel="stylesheet" href="../shell/shell-190-navigation.css" />
        <link rel="stylesheet" href="./production-start-303-station.css" />
      </helmet>
      <div class="ps-part {{ rootCls }}" lang="{{ lang }}" data-psu="{{ uid }}" style="{{ rootStyle }}">
        <sc-if value="{{ isColumn }}">
          <section class="ps-list" aria-labelledby="{{ ids.h }}" aria-busy="{{ busy }}">
            <div class="ps-list-h">
              <h2 class="ps-h2 {{ f.heading }}" id="{{ ids.h }}" tabIndex="-1">{{ heading }}</h2>
              <span class="ps-sm ps-mut">{{ t.byStart }}</span>
              <sc-if value="{{ headBadge }}">
                <button class="badge ps-badge ps-unsent {{ f.unsent }}" type="button"><span class="ic" data-icon="Upload"></span>{{ unsentOn }}</button>
              </sc-if>
            </div>
            <div class="ps-list-w">
              <div class="ps-list-b">
                <sc-if value="{{ showAlert }}">
                  <div class="ps-alert {{ alert.cls }}"><span class="ic" data-icon="CircleAlert"></span><p>{{ alert.text }} {{ alert.id }}</p><button class="btn lg v-outline {{ f.retry }}" type="button">{{ t.tryAgain }}</button></div>
                </sc-if>
                <sc-if value="{{ showRows }}">
                  <ul class="ps-rows">
                    <sc-for list="{{ open }}" as="j">
                      <li>
                        <button class="ps-jr {{ j.cls }}" type="button" aria-current="{{ j.cur }}" data-unsent="{{ j.unsentAttr }}">
                          <span class="ps-jr-b">
                            <span class="ps-jr-t"><span class="ps-jr-n">{{ j.num }}</span><span class="badge ps-badge {{ j.stCls }}"><span class="ic" data-icon="{{ j.stI }}"></span>{{ j.stT }}</span><sc-if value="{{ j.hasFlag }}"><span class="badge ps-badge ps-flag">{{ j.flag }}</span></sc-if></span>
                            <span class="ps-jr-a"><span lang="{{ j.lang }}">{{ j.art }}</span><sc-if value="{{ j.unsent }}"><span class="badge ps-badge ps-unsent"><span class="ic" data-icon="Upload"></span>{{ t.unsent }}</span></sc-if></span>
                            <span class="ps-jr-m"><sc-for list="{{ j.meta }}" as="m"><span>{{ m }}</span></sc-for></span>
                          </span>
                          <span class="ic ps-chev" data-icon="ChevronRight"></span>
                        </button>
                      </li>
                    </sc-for>
                  </ul>
                  <sc-if value="{{ hasDone }}">
                    <h3 class="ps-grp">{{ t.finishedToday }}</h3>
                    <ul class="ps-rows">
                      <sc-for list="{{ done }}" as="j">
                        <li>
                          <button class="ps-jr {{ j.cls }}" type="button" aria-current="{{ j.cur }}">
                            <span class="ps-jr-b">
                              <span class="ps-jr-t"><span class="ps-jr-n">{{ j.num }}</span><span class="badge ps-badge {{ j.stCls }}"><span class="ic" data-icon="{{ j.stI }}"></span>{{ j.stT }}</span></span>
                              <span class="ps-jr-a"><span lang="{{ j.lang }}">{{ j.art }}</span></span>
                              <span class="ps-jr-m"><sc-for list="{{ j.meta }}" as="m"><span>{{ m }}</span></sc-for></span>
                            </span>
                            <span class="ic ps-chev" data-icon="ChevronRight"></span>
                          </button>
                        </li>
                      </sc-for>
                    </ul>
                  </sc-if>
                </sc-if>
                <sc-if value="{{ loading }}">
                  <span class="ps-vh">{{ t.loadingJobs }}</span>
                  <sc-for list="{{ skel }}" as="s">
                    <div class="ps-skrow" aria-hidden="true"><span class="sk" style="{{ s.a }}"></span><span class="sk" style="{{ s.b }}"></span><span class="sk" style="{{ s.c }}"></span></div>
                  </sc-for>
                </sc-if>
                <sc-if value="{{ empty }}">
                  <div class="ps-empty">
                    <p class="ps-empty-t">{{ emptyT }}</p>
                    <p class="ps-mut">{{ emptyText }}</p>
                    <sc-if value="{{ hasAlt }}"><button class="btn lg v-outline {{ f.alt }}" type="button">{{ altText }}</button></sc-if>
                  </div>
                </sc-if>
                <sc-if value="{{ failed }}">
                  <div class="ps-alert err"><span class="ic" data-icon="CircleAlert"></span><p><b>{{ t.errorTitle }}</b> {{ t.errorId }}</p><button class="btn lg v-outline {{ f.retry }}" type="button">{{ t.tryAgain }}</button></div>
                </sc-if>
              </div>
              <sc-if value="{{ sb.show }}"><span class="ps-sb" style="{{ sb.style }}" aria-hidden="true"></span></sc-if>
            </div>
          </section>
        </sc-if>
        <sc-if value="{{ isPicker }}">
          <div class="ps-pick">
            <h2 class="ps-h2 {{ f.heading }}" id="{{ ids.h }}" tabIndex="-1">{{ heading }}</h2>
            <span class="ps-grow ps-mut">{{ pickCount }}</span>
            <div class="ps-pick-r">
              <button class="btn lg v-outline {{ f.change }}" type="button" aria-haspopup="dialog" aria-expanded="{{ sheetOpenStr }}" aria-describedby="{{ pickDesc }}">{{ t.changeJob }}</button>
              <sc-if value="{{ hasUnsent }}"><span class="badge ps-badge ps-unsent" id="{{ ids.unsent }}"><span class="ic" data-icon="Upload"></span>{{ unsentOn }}</span></sc-if>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ sheetOpen }}">
          <div class="sh-ov"></div>
          <div class="ps-sheet" role="dialog" aria-modal="true" aria-labelledby="{{ ids.sh }}" data-sheet="1">
            <div class="ps-sheet-h">
              <div><h2 class="ps-h2" id="{{ ids.sh }}">{{ heading }}</h2><p class="ps-sm ps-mut">{{ t.byStart }}</p></div>
              <button class="btn lg ib v-ghost {{ f.close }}" type="button" aria-label="{{ t.close }}"><span class="ic" data-icon="X"></span></button>
            </div>
            <div class="ps-list-w">
              <div class="ps-list-b">
                <ul class="ps-rows">
                  <sc-for list="{{ open }}" as="j">
                    <li>
                      <button class="ps-jr {{ j.cls }}" type="button" aria-current="{{ j.cur }}">
                        <span class="ps-jr-b">
                          <span class="ps-jr-t"><span class="ps-jr-n">{{ j.num }}</span><span class="badge ps-badge {{ j.stCls }}"><span class="ic" data-icon="{{ j.stI }}"></span>{{ j.stT }}</span><sc-if value="{{ j.hasFlag }}"><span class="badge ps-badge ps-flag">{{ j.flag }}</span></sc-if></span>
                          <span class="ps-jr-a"><span lang="{{ j.lang }}">{{ j.art }}</span><sc-if value="{{ j.unsent }}"><span class="badge ps-badge ps-unsent"><span class="ic" data-icon="Upload"></span>{{ t.unsent }}</span></sc-if></span>
                          <span class="ps-jr-m"><sc-for list="{{ j.meta }}" as="m"><span>{{ m }}</span></sc-for></span>
                        </span>
                        <span class="ic ps-chev" data-icon="ChevronRight"></span>
                      </button>
                    </li>
                  </sc-for>
                </ul>
                <sc-if value="{{ hasDone }}">
                  <h3 class="ps-grp">{{ t.finishedToday }}</h3>
                  <ul class="ps-rows">
                    <sc-for list="{{ done }}" as="j">
                      <li>
                        <button class="ps-jr {{ j.cls }}" type="button" aria-current="{{ j.cur }}">
                          <span class="ps-jr-b">
                            <span class="ps-jr-t"><span class="ps-jr-n">{{ j.num }}</span><span class="badge ps-badge {{ j.stCls }}"><span class="ic" data-icon="{{ j.stI }}"></span>{{ j.stT }}</span></span>
                            <span class="ps-jr-a"><span lang="{{ j.lang }}">{{ j.art }}</span></span>
                            <span class="ps-jr-m"><sc-for list="{{ j.meta }}" as="m"><span>{{ m }}</span></sc-for></span>
                          </span>
                          <span class="ic ps-chev" data-icon="ChevronRight"></span>
                        </button>
                      </li>
                    </sc-for>
                  </ul>
                </sc-if>
              </div>
              <sc-if value="{{ sb.show }}"><span class="ps-sb" style="{{ sb.style }}" aria-hidden="true"></span></sc-if>
            </div>
          </div>
        </sc-if>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"enum","options":["1920x1080","1280x800","800x1280"],"default":"1920x1080","tsType":"string"},"layout":{"editor":"enum","options":["auto","column","picker"],"default":"auto","tsType":"string"},"sheet":{"editor":"enum","options":["closed","open"],"default":"closed","tsType":"string"},"machine":{"editor":"enum","options":["Press 4","Press 3"],"default":"Press 4","tsType":"string"},"selected":{"editor":"text","default":"5001.20","tsType":"string"},"unsent":{"editor":"text","default":"5002.10","tsType":"string"},"state":{"editor":"enum","options":["populated","loading","empty","stale","error"],"default":"populated","tsType":"string"},"after":{"editor":"enum","options":["none","sent","corrected"],"default":"none","tsType":"string"},"alt":{"editor":"text","default":"none","tsType":"string"},"scroll":{"editor":"int","default":0,"tsType":"number"},"focus":{"editor":"text","default":"auto","tsType":"string"},"strings":{"editor":"enum","options":["default","long"],"default":"default","tsType":"string"},"solo":{"editor":"enum","options":["auto","on","off"],"default":"auto","tsType":"string"},"theme":{"editor":"enum","options":["inherit","dark"],"default":"inherit","tsType":"string"},"idp":{"editor":"text","default":"jl","tsType":"string"}}'>
      class Component extends DCLogic {
        componentDidMount() {
          // Icons: lucide fills every [data-icon] span and redraws one whose data-icon changed (the frame's filler, same flag).
          if (!window.__nmIconFill2) {
            window.__nmIconFill2 = true;
            const fill = () => {
              const L = window.lucide;
              if (!L) return;
              document.querySelectorAll("[data-icon]").forEach((el) => {
                const name = el.getAttribute("data-icon");
                if (el.firstElementChild && el.getAttribute("data-icon-drawn") === name) return;
                const node = L.icons[name];
                if (!node) return;
                while (el.firstChild) el.removeChild(el.firstChild);
                el.appendChild(L.createElement(node, { "aria-hidden": "true", focusable: "false" }));
                el.setAttribute("data-icon-drawn", name);
              });
            };
            let queued = false;
            const schedule = () => {
              if (queued) return;
              queued = true;
              setTimeout(() => { queued = false; fill(); }, 0);
            };
            new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["data-icon"] });
            const wait = () => (window.lucide ? schedule() : setTimeout(wait, 100));
            wait();
          }
          // The data script loads from the helmet; draw again once it is there.
          const ready = () => (window.PS ? this.forceUpdate() : setTimeout(ready, 50));
          if (!window.PS) ready();
          // Measure the scroll area: apply the scroll prop, draw the thumb at the visible share, and show the
          // Unsent entries badge in the header row when the row that holds them is out of view (rule 19.14).
          this.__measure = () => {
            const root = document.querySelector('[data-psu="' + this.__uid + '"]');
            if (!root) return;
            const sc = root.querySelector("[data-sheet] .ps-list-b") || root.querySelector(".ps-list .ps-list-b");
            const prev = this.state || {};
            if (!sc) { if (prev.sb || prev.out) this.setState({ sb: null, out: false }); return; }
            const want = Number(this.props.scroll || 0);
            const key = want + "|" + this.__layout;
            if (this.__applied !== key) { sc.scrollTop = want; this.__applied = key; }
            const ch = sc.clientHeight, sh = sc.scrollHeight, st = sc.scrollTop;
            let sb = null;
            if (sh > ch + 1) {
              const track = ch - 8;
              sb = { h: Math.max(24, Math.round(track * ch / sh)), top: Math.round(sc.offsetTop + 4 + track * st / sh) };
            }
            let out = false;
            const u = sc.querySelector('[data-unsent="1"]');
            if (u) { const a = u.getBoundingClientRect(), b = sc.getBoundingClientRect(); out = a.top > b.bottom - 24 || a.bottom < b.top + 24; }
            if (JSON.stringify(prev.sb || null) !== JSON.stringify(sb) || !!prev.out !== out) this.setState({ sb: sb, out: out });
          };
          setTimeout(this.__measure, 40);
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.__measure && this.__measure());
          if (window.ResizeObserver) {
            this.__ro = new ResizeObserver(() => this.__measure && this.__measure());
            setTimeout(() => { const root = document.querySelector('[data-psu="' + this.__uid + '"]'); if (root && this.__ro) this.__ro.observe(root); }, 0);
          }
        }
        componentDidUpdate() {
          if (this.__measure) setTimeout(this.__measure, 0);
        }
        componentWillUnmount() {
          if (this.__ro) this.__ro.disconnect();
          this.__ro = null;
        }
        renderVals() {
          const p = this.props || {};
          const PS = window.PS;
          this.__uid = this.__uid || "psj" + Math.random().toString(36).slice(2, 9);
          const st0 = this.state || {};
          const idp = String(p.idp || "jl");
          const pick = (v, d, opts) => { const s = v === undefined || v === null || String(v).trim() === "" ? d : String(v).trim(); return opts.indexOf(s) < 0 ? d : s; };
          const size = pick(p.size, "1920x1080", ["1920x1080", "1280x800", "800x1280"]);
          const portrait = size === "800x1280";
          const layout0 = pick(p.layout, "auto", ["auto", "column", "picker"]);
          const layout = layout0 === "auto" ? (portrait ? "picker" : "column") : layout0;
          const sheetOpen = layout === "picker" && p.sheet === "open";
          this.__layout = layout + (sheetOpen ? "+sheet" : "");
          // Rendered as the page root, the part draws the station's main area itself; mounted in a frame it inherits.
          const solo = p.solo === "on" || (p.solo !== "off" && !!window.__dcRootName && window.__dcRootName() === "production-start-303-station-joblist");
          const colW = size === "1920x1080" ? 420 : 320;
          const rootStyle = solo ? "width:" + (layout === "column" ? colW + 48 : 800) + "px" : "display:flex;flex-direction:column;flex:1 1 auto;min-width:0;min-height:0";
          const ids = { h: idp + "-h", sh: idp + "-sh", unsent: idp + "-unsent" };
          const base = { uid: this.__uid, rootCls: (solo ? "solo" + (layout === "column" ? " fill" : "") : "") + (p.theme === "dark" ? " dark" : ""), rootStyle: rootStyle, lang: "en", ids: ids, t: {}, f: {}, alert: {}, sb: {}, open: [], done: [], skel: [], isColumn: false, isPicker: false, sheetOpen: false };
          if (!PS) return base;
          const strings = p.strings === "long" ? "long" : "default";
          const T = PS.tr(strings);
          const machine = pick(p.machine, "Press 4", ["Press 4", "Press 3"]);
          const mName = PS.mName(machine, strings);
          const selected = String(p.selected || "5001.20").trim();
          const unsent = String(p.unsent || "5002.10").trim();
          const state = pick(p.state, "populated", ["populated", "loading", "empty", "stale", "error"]);
          let focus = String(p.focus || "auto").trim();
          if (focus === "auto") focus = sheetOpen ? selected : "none";
          const F = (k) => (focus === k ? "is-focus" : "");
          const list = PS.jobsOn(machine);
          const N = (v, j) => PS.num(v, j.dec);
          const row = (j) => {
            const st = PS.STATUS[j.status];
            const u = PS.unit(j, strings);
            const rem = j.qty - j.good - j.scrap;
            let meta = [];
            if (j.status === "finished") meta = [T.finishedSum(N(j.good, j), N(j.scrap, j), N(j.qty, j), u), T.finishedAt(j.finishedAt)];
            else if (j.status === "planned") meta = [T.qtyOnly(N(j.qty, j), u), T.plannedAt(j.planned)].concat(j.priority ? [T.priority(j.priority)] : []);
            else if (j.status === "paused") meta = [T.left(N(rem, j), N(j.qty, j), u), T.pausedSince(j.pausedSince)];
            else meta = [T.left(N(rem, j), N(j.qty, j), u)].concat(j.window ? [strings === "long" ? j.windowDe : j.window] : [T.startedAt(j.startedAt)]).concat(j.priority ? [T.priority(j.priority)] : []);
            const flag = j.flag === "overdue" ? T.overdue : j.flag === "elsewhere" ? T.plannedOn(PS.mName(j.plannedOn, strings)) : "";
            const sel = j.num === selected;
            const isUnsent = j.num === unsent && j.status !== "finished";
            return {
              num: j.num,
              art: strings === "long" ? j.artDe : j.art,
              lang: strings === "long" ? j.artLang : undefined,
              cls: (sel ? "sel" : "") + (focus === j.num ? " is-focus" : ""),
              cur: sel ? "true" : undefined,
              stCls: "ps-" + j.status, stI: st.icon, stT: strings === "long" ? st.de : st.en,
              hasFlag: !!flag, flag: flag,
              unsent: isUnsent, unsentAttr: isUnsent ? "1" : undefined,
              meta: meta
            };
          };
          // after="sent" or "corrected": the selected job's row once the server has answered (remaining quantity).
          const afterK = pick(p.after, "none", ["none", "sent", "corrected"]);
          const fix = (j) => (j.num === selected ? PS.after(j, afterK) : j);
          const open = list.open.map(fix).map(row), done = list.done.map(fix).map(row);
          const hasUnsent = list.open.some((j) => j.num === unsent);
          const pop = state === "populated" || state === "stale";
          const sb = st0.sb && (layout === "column" || sheetOpen) ? { show: true, style: "top:" + st0.sb.top + "px;height:" + st0.sb.h + "px" } : { show: false };
          const altM = String(p.alt || "none").trim();
          return Object.assign(base, {
            lang: T.lang,
            t: T,
            f: { heading: F("heading"), unsent: F("unsent"), retry: F("retry"), alt: F("alt"), change: F("change"), close: F("close") },
            heading: T.jobsOn(mName),
            isColumn: layout === "column",
            isPicker: layout === "picker",
            sheetOpen: sheetOpen,
            sheetOpenStr: layout === "picker" ? (sheetOpen ? "true" : "false") : undefined,
            busy: state === "loading" ? "true" : undefined,
            headBadge: layout === "column" && pop && hasUnsent && !!st0.out,
            unsentOn: T.unsentOn(unsent),
            showAlert: state === "stale",
            alert: { cls: "warn", text: T.staleText, id: T.errorId },
            showRows: pop,
            open: open,
            done: done,
            hasDone: done.length > 0,
            loading: state === "loading",
            skel: [0, 1, 2, 3].map((i) => ({ a: "width:" + [46, 52, 40, 48][i] + "%;height:20px", b: "width:" + [64, 58, 70, 54][i] + "%", c: "width:" + [80, 72, 60, 76][i] + "%" })),
            empty: state === "empty",
            emptyT: T.noJobs(mName),
            emptyText: T.noJobsText(mName),
            hasAlt: altM !== "none" && altM !== "",
            altText: T.showJobsOn(PS.mName(altM, strings)),
            failed: state === "error",
            sb: sb,
            pickCount: T.pickCount(list.open.length + list.done.length, selected),
            hasUnsent: hasUnsent,
            pickDesc: hasUnsent ? ids.unsent : undefined
          });
        }
      }
    </script>
  </body>
</html>
