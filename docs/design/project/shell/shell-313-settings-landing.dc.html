<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings landing</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" />
        <script src="https://unpkg.com/lucide@1.45.0/dist/umd/lucide.min.js" integrity="sha384-1K5mjRr9EvBwlp0ALeQf1DEysXoqYs+nRQmDBi/UrEty5RgCjPRph7NJZkRjAFWJ" crossorigin="anonymous"></script>
        <script src="./shell-313-settings-data.js"></script>
        <link rel="stylesheet" href="../ui/tokens.css" />
        <link rel="stylesheet" href="../ui/ui-189-tokens-page.css" />
        <link rel="stylesheet" href="./shell-190-navigation.css" />
        <link rel="stylesheet" href="../ui/ui-222-list-form.css" />
        <link rel="stylesheet" href="./shell-313-settings.css" />
      </helmet>
      <div class="set-landp {{ rootCls }}" lang="{{ lang }}" data-screen-label="{{ label }}">
        <sc-for list="{{ groups }}" as="g">
          <div class="set-lgrp">
            <sc-if value="{{ g.hasHead }}"><h2 class="set-h2 {{ g.hcls }}" id="{{ g.hid }}">{{ g.head }}</h2></sc-if>
            <ul class="set-land {{ g.lcls }}" role="list" aria-labelledby="{{ g.lby }}" aria-label="{{ g.alabel }}">
              <sc-for list="{{ g.items }}" as="i">
                <li>
                  <a class="set-lr {{ i.cls }}" href="#" lang="{{ i.lang }}">
                    <span class="ic" data-icon="{{ i.icon }}"></span>
                    <span class="set-lr-t">
                      <span class="set-lr-n"><span>{{ i.label }}</span><sc-if value="{{ i.onb }}"><span class="sh-vh">, </span><span class="badge sh-onboarding">{{ t.onboarding }}</span></sc-if></span>
                      <sc-if value="{{ i.hasD }}"><span class="set-lr-d">{{ i.d }}</span></sc-if>
                    </span>
                    <span class="ic set-lr-c" data-icon="ChevronRight"></span>
                  </a>
                </li>
              </sc-for>
            </ul>
          </div>
        </sc-for>
        <sc-if value="{{ isEmpty }}">
          <div class="set-empty">
            <div class="lf-state">
              <span class="big"><span class="ic" data-icon="Settings"></span></span>
              <h2 class="lf-state-h">{{ t.emptyTitle }}</h2>
              <p>{{ t.emptyText }}</p>
              <div class="acts"><a class="btn v-outline {{ f.action }}" href="#">{{ emptyAct }}</a></div>
            </div>
          </div>
        </sc-if>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"area":{"editor":"enum","options":["company","plant"],"default":"company","tsType":"string"},"size":{"editor":"enum","options":["wide","narrow"],"default":"wide","tsType":"string"},"state":{"editor":"enum","options":["populated","empty"],"default":"populated","tsType":"string"},"company":{"editor":"text","default":"","tsType":"string"},"plant":{"editor":"text","default":"","tsType":"string"},"from":{"editor":"text","default":"","tsType":"string"},"back":{"editor":"enum","options":["auto","home"],"default":"auto","tsType":"string"},"entries":{"editor":"text","default":"all","tsType":"string"},"others":{"editor":"text","default":"auto","tsType":"string"},"onboarding":{"editor":"text","default":"","tsType":"string"},"unavailable":{"editor":"text","default":"","tsType":"string"},"focus":{"editor":"text","default":"none","tsType":"string"},"hover":{"editor":"text","default":"","tsType":"string"},"strings":{"editor":"enum","options":["default","long"],"default":"default","tsType":"string"},"theme":{"editor":"enum","options":["inherit","light","dark"],"default":"inherit","tsType":"string"}}'>
      class Component extends DCLogic {
        componentDidMount() {
          const ready = () => (window.NM313 ? this.forceUpdate() : setTimeout(ready, 50));
          if (!window.NM313) ready();
          // Icons: the lucide filler of Shell.dc.html (flag __nmIconFill2), so the part also draws its icons on its own.
          if (window.__nmIconFill2) return;
          window.__nmIconFill2 = true;
          const fill = () => {
            const L = window.lucide;
            if (!L) return;
            document.querySelectorAll("[data-icon]").forEach((el) => {
              const name = el.getAttribute("data-icon");
              if (el.firstElementChild && el.getAttribute("data-icon-drawn") === name) return;
              const node = L.icons[name];
              if (!node) return;
              while (el.firstChild) el.removeChild(el.firstChild);
              el.appendChild(L.createElement(node, { "aria-hidden": "true", focusable: "false" }));
              el.setAttribute("data-icon-drawn", name);
            });
          };
          let queued = false;
          const schedule = () => { if (queued) return; queued = true; setTimeout(() => { queued = false; fill(); }, 0); };
          new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["data-icon"] });
          const wait = () => (window.lucide ? schedule() : setTimeout(wait, 100));
          wait();
        }
        renderVals() {
          const P = this.props || {};
          const D = window.NM313;
          if (!this.uid) { window.__nmSetLandSeq = (window.__nmSetLandSeq || 0) + 1; this.uid = "set-l" + window.__nmSetLandSeq; }
          const u = this.uid;
          const has = (v) => v !== undefined && v !== null && String(v).trim() !== "";
          const pick = (v, opts, d) => { const s = has(v) ? String(v).trim() : ""; return opts.indexOf(s) >= 0 ? s : d; };
          const theme = pick(P.theme, ["inherit", "light", "dark"], "inherit");
          if (!D) return { t: { unavailable: "", onboarding: "", emptyTitle: "", emptyText: "" }, rootCls: "", lang: null, label: "Settings landing", groups: [], isEmpty: false, emptyAct: "", f: { action: "" } };

          // The landing of an area (rules 1.4, 4.1, 4.3, 8.5): the same groups and order as the settings navigation, then
          // Other settings (rules 7.3). At 1280 and up two columns with a line per entry, at 320 one column without the
          // lines (C5). state="empty" draws the empty state of a landing where no entry is permitted (rules 10.6).
          const area = pick(P.area || P.kind, ["company", "plant"], "company");
          const narrow = pick(P.size, ["wide", "narrow"], "wide") === "narrow";
          const long = pick(P.strings, ["default", "long"], "default") === "long";
          const L = long ? "de" : "en";
          const t = D.t[L];
          const data = D.data[L];
          const list = (v) => String(v || "").split(/[|,]/).map((s) => s.trim()).filter(Boolean);
          const onb = has(P.onboarding) ? (String(P.onboarding).trim() === "none" ? [] : list(P.onboarding)) : data.onboarding;
          const focus = has(P.focus) ? String(P.focus).trim() : "none";
          const hover = has(P.hover) ? String(P.hover).trim() : "";
          const unav = list(P.unavailable);
          const allowed = has(P.entries) && String(P.entries).trim() !== "all" ? list(P.entries) : null;
          const plantIn = has(P.plant) ? String(P.plant).trim() : "";
          const coIn = has(P.company) ? String(P.company).trim() : "";
          const co = data.companies.filter((c) => (coIn ? c.name === coIn : plantIn && c.plants.indexOf(plantIn) >= 0))[0] || data.companies[0];
          const company = coIn || co.name;
          const plant = plantIn || co.plants[0];
          const from = has(P.from) ? String(P.from).trim() : co.plants[0];
          let n = 0;
          const item = (o) => {
            const k = n++;
            const id = o.id || String(k);
            // An unavailable entry reads "{label} (unavailable)" with one space, drawn as its navigation entry (set-unav).
            return Object.assign({ lang: null, unav: false, onb: false, hasD: !!o.d && !narrow, d: o.d || "",
              label: o.unav ? o.t + " " + t.unavailable : o.t,
              cls: [hover === id ? "hov" : "", focus === "first" && k === 0 ? "is-focus" : "", focus === "entry:" + id ? "is-focus" : "", o.d ? "" : "nod", o.unav ? "set-unav" : ""].filter(Boolean).join(" ") }, o);
          };
          const groups = [];
          const isEmpty = pick(P.state, ["populated", "empty"], "populated") === "empty";
          if (!isEmpty) {
            const plantOnb = area === "plant" && onb.indexOf(plant) >= 0;
            const coOnb = area === "company" && onb.indexOf(company) >= 0 && !!D.companyOnboarding;
            D.areas[area].forEach((g, gi) => {
              let ents = g.entries.slice();
              if (gi === 0 && plantOnb) ents = [D.onboarding].concat(ents);
              if (gi === 0 && coOnb) ents = [D.companyOnboarding].concat(ents);
              ents = ents.filter((e) => !allowed || allowed.indexOf(e.id) >= 0 || e.id === "onboarding");
              if (!ents.length) return;
              const hid = u + "-g" + gi;
              groups.push({ hasHead: gi > 0, head: g[L], hcls: "", hid: gi > 0 ? hid : null, lby: gi > 0 ? hid : null,
                alabel: gi > 0 ? null : (area === "company" ? t.companyTitle : t.plantTitle.replace("{plant}", plant)), lcls: narrow ? "" : "cols",
                items: ents.map((e) => item({ id: e.id, t: e[L], d: long ? e.dde : e.den, icon: e.icon, lang: long && e.langDe ? e.langDe : null, unav: unav.indexOf(e.mod) >= 0 })) });
            });
            const oMode = has(P.others) ? String(P.others).trim() : "auto";
            let oList;
            if (oMode === "none") oList = [];
            else if (oMode === "auto") oList = area === "plant" ? [{ name: company, kind: "company" }] : co.plants.map((p) => ({ name: p, kind: "plant" }));
            else oList = list(oMode).map((p) => ({ name: p, kind: area === "plant" ? "company" : "plant" }));
            if (oList.length) {
              const hid = u + "-o";
              groups.push({ hasHead: true, head: t.others, hcls: "", hid: hid, lby: hid, alabel: null, lcls: narrow ? "" : "cols",
                items: oList.map((o) => item({ id: "other:" + o.name, t: t.areaLink.replace("{name}", o.name), icon: o.kind === "company" ? "Building2" : "Factory", onb: o.kind === "plant" && onb.indexOf(o.name) >= 0 })) });
            }
          }
          // The way out of an empty landing: company settings go back to the plant the user came from (else Your plants,
          // rules 6.7); a plant's landing goes to the plant's home.
          const back = pick(P.back, ["auto", "home"], "auto");
          const emptyAct = area === "company" ? (back === "home" ? t.backHome : t.back.replace("{plant}", from)) : t.back.replace("{plant}", plant);
          return {
            t: t, f: { action: focus === "action" ? "is-focus" : "" },
            rootCls: (theme !== "inherit" ? "set-solo " : "") + (theme === "dark" ? "dark " : "") + (narrow ? "" : "set-lwide"),
            lang: long ? "de" : null,
            label: "Settings landing, " + area + (isEmpty ? ", empty" : "") + (narrow ? ", 320" : "") + (long ? ", long strings" : ""),
            groups: groups, isEmpty: isEmpty, emptyAct: emptyAct
          };
        }
      }
    </script>
  </body>
</html>
