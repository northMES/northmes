"""One page of the User list, with keyset paging over opaque cursors."""
type UserConnection {
  """The items of the page in the list's order."""
  edges: [UserEdge!]!

  """Where the page sits in the list."""
  pageInfo: PageInfo!

  """
  How many items the list holds with the same search and filters, across all pages.
  """
  totalCount: Int!
}

"""One User of a page, with its cursor."""
type UserEdge {
  """The cursor of this item, for after or before."""
  cursor: String!

  """The User."""
  node: User!
}

"""One entry of the User list's orderBy."""
input UserOrderBy {
  """The direction to sort in, ascending by default."""
  direction: SortDirection = ASC

  """The field to sort by."""
  field: UserSortField!
}

"""The fields the User list sorts by."""
enum UserSortField {
  """Sorts by name."""
  NAME

  """Sorts by username."""
  USERNAME
}

"""
The signed-in user and what they hold at the request's plant and at its company.
"""
type Viewer {
  """The permission keys the user holds at the plant's company, sorted."""
  companyPermissions: [String!]!

  """
  The permission keys the user holds at the plant, from roles there or at its company, sorted.
  """
  plantPermissions: [String!]!

  """The signed-in user's id."""
  userId: ID!
}
