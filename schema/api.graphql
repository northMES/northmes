type AccessScope {
  id: ID!
  kind: ScopeKind!
  name: String!
}

type Article {
  allPlants: Boolean!
  archivedAt: DateTime
  code: String!
  id: ID!
  name: String!
  plants: [Plant!]!
  updatedAt: DateTime!
  version: Int!
}

type ArticleConnection {
  edges: [ArticleEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ArticleEdge {
  cursor: String!
  node: Article!
}

input ArticleOrderBy {
  direction: SortDirection = ASC
  field: ArticleSortField!
}

enum ArticleSortField {
  CODE
  NAME
  UPDATED_AT
}

type Company {
  id: ID!
  name: String!
  plants: [Plant!]!
}

input CoreArchiveArticleInput {
  expectedVersion: Int!
  id: ID!
}

input CoreAssignRoleInput {
  companyId: String
  id: ID!
  reason: String
  roleId: ID!
  scopeId: ID!
  userId: ID!
}

input CoreBlockUserInput {
  companyId: String
  id: ID!
  reason: String
}

input CoreCreateArticleInput {
  allPlants: Boolean
  code: String!
  companyId: String
  id: ID!
  name: String!
  plants: [String!]
}

input CoreCreateRoleInput {
  companyId: String
  id: ID!
  name: String!
  permissions: [String!]!
  reason: String
}

input CoreCreateUserInput {
  companyId: String
  email: String!
  id: ID!
  name: String!
  reason: String
  roleId: String
  scopeId: String
  username: String!
}

input CoreDeleteRoleInput {
  expectedVersion: Int!
  id: ID!
}

input CoreRemoveRoleAssignmentInput {
  id: ID!
  reason: String
}

input CoreResetPasswordInput {
  companyId: String
  id: ID!
  reason: String
}

input CoreRestoreArticleInput {
  expectedVersion: Int!
  id: ID!
}

input CoreSetArticlePlantsInput {
  allPlants: Boolean!
  expectedVersion: Int!
  id: ID!
  plants: [String!]!
}

input CoreUnblockUserInput {
  companyId: String
  id: ID!
  reason: String
}

input CoreUpdateArticleInput {
  code: String!
  expectedVersion: Int!
  id: ID!
  name: String!
}

input CoreUpdateRoleInput {
  expectedVersion: Int!
  id: ID!
  name: String!
  permissions: [String!]!
  reason: String
}

input CoreUpsertArticleInput {
  allPlants: Boolean
  code: String!
  companyId: String
  expectedVersion: Int
  id: ID!
  name: String!
  plants: [String!]
}

type CreatedUser {
  temporaryPassword: String!
  user: User!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type EffectivePermission {
  grantedBy: [RoleAssignment!]!
  permission: Permission!
}

type Mutation {
  coreArchiveArticle(input: CoreArchiveArticleInput!): Article!
  coreAssignRole(input: CoreAssignRoleInput!): RoleAssignment!
  coreBlockUser(input: CoreBlockUserInput!): User!
  coreCreateArticle(input: CoreCreateArticleInput!): Article!
  coreCreateRole(input: CoreCreateRoleInput!): Role!
  coreCreateUser(input: CoreCreateUserInput!): CreatedUser!
  coreDeleteRole(input: CoreDeleteRoleInput!): Role!
  coreRemoveRoleAssignment(input: CoreRemoveRoleAssignmentInput!): RoleAssignment!
  coreResetPassword(input: CoreResetPasswordInput!): PasswordReset!
  coreRestoreArticle(input: CoreRestoreArticleInput!): Article!
  coreSetArticlePlants(input: CoreSetArticlePlantsInput!): Article!
  coreUnblockUser(input: CoreUnblockUserInput!): User!
  coreUpdateArticle(input: CoreUpdateArticleInput!): Article!
  coreUpdateRole(input: CoreUpdateRoleInput!): Role!
  coreUpsertArticle(input: CoreUpsertArticleInput!): Article!
  planningReleaseProductionOrder(input: PlanningReleaseProductionOrderInput!): ProductionOrder!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type PasswordReset {
  temporaryPassword: String!
  user: User!
}

type Permission {
  action: String!
  installed: Boolean!
  key: String!
  moduleId: String!
  resource: String!
}

type PermissionModule {
  moduleId: String!
  resources: [PermissionResource!]!
}

type PermissionResource {
  permissions: [Permission!]!
  resource: String!
}

input PlanningReleaseProductionOrderInput {
  expectedVersion: Int!
  id: ID!
}

type Plant {
  id: ID!
  name: String!
  slug: String!
}

type ProductionOrder {
  article: Article
  id: ID!
  number: String!
  quantity: String!
  status: String!
  version: Int!
}

type Query {
  coreArticle(
    """
    The company of a request from company settings, which names no plant. At a plant it may be left out, or must be the plant's company.
    """
    companyId: ID
    id: ID!
  ): Article
  coreArticles(
    after: String
    before: String

    """
    The company of a request from company settings, which names no plant. At a plant it may be left out, or must be the plant's company.
    """
    companyId: ID
    first: Int = 25
    includeArchived: Boolean = false
    last: Int
    orderBy: [ArticleOrderBy!]
    search: String

    """Only the articles assigned to no plant and not to All plants."""
    unassigned: Boolean
  ): ArticleConnection!
  coreCompanies: [Company!]!
  corePermissionCatalog(
    """
    The company of a request from company settings, which names no plant. At a plant it may be left out, or must be the plant's company.
    """
    companyId: ID
  ): [PermissionModule!]!
  corePlantRoleAssignments: [RoleAssignment!]!
  coreRole(
    """
    The company of a request from company settings, which names no plant. At a plant it may be left out, or must be the plant's company.
    """
    companyId: ID
    id: ID!
  ): Role
  coreRoles(
    """
    The company of a request from company settings, which names no plant. At a plant it may be left out, or must be the plant's company.
    """
    companyId: ID
  ): [Role!]!
  coreUser(
    """
    The company of a request from company settings, which names no plant. At a plant it may be left out, or must be the plant's company.
    """
    companyId: ID
    id: ID!
  ): User
  coreUsers(
    after: String
    before: String

    """Only the blocked users when true, only the active ones when false."""
    blocked: Boolean

    """
    The company of a request from company settings, which names no plant. At a plant it may be left out, or must be the plant's company.
    """
    companyId: ID
    first: Int = 25
    last: Int
    orderBy: [UserOrderBy!]

    """
    Only the users who hold this role of the company, at any of its places.
    """
    roleId: ID
    search: String
  ): UserConnection!
  coreViewer(
    """
    The company of a request from company settings, which names no plant. At a plant it may be left out, or must be the plant's company.
    """
    companyId: ID
  ): Viewer!
  planningProductionOrders: [ProductionOrder!]!
}

type Role {
  holders: [RoleAssignment!]!
  id: ID!
  key: String!
  moduleId: String
  name: String!
  origin: RoleOrigin!
  permissions: [String!]!
  version: Int!
}

type RoleAssignment {
  id: ID!
  role: Role
  scope: AccessScope!
  user: User!
}

enum RoleOrigin {
  CUSTOM
  MODULE
}

enum ScopeKind {
  COMPANY
  PLANT
}

enum SortDirection {
  ASC
  DESC
}

type User {
  blocked: Boolean!
  effectivePermissions: [EffectivePermission!]!
  id: ID!
  name: String!
  roleAssignments: [RoleAssignment!]!
  username: String!
}

type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type UserEdge {
  cursor: String!
  node: User!
}

input UserOrderBy {
  direction: SortDirection = ASC
  field: UserSortField!
}

enum UserSortField {
  NAME
  USERNAME
}

type Viewer {
  companyPermissions: [String!]!
  plantPermissions: [String!]!
  userId: ID!
}
