type AccessScope {
  id: ID!
  kind: ScopeKind!
  name: String!
}

type Article {
  archivedAt: DateTime
  code: String!
  id: ID!
  name: String!
  version: Int!
}

type ArticleConnection {
  edges: [ArticleEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ArticleEdge {
  cursor: String!
  node: Article!
}

input ArticleOrderBy {
  direction: SortDirection = ASC
  field: ArticleSortField!
}

enum ArticleSortField {
  CODE
  NAME
}

type Company {
  id: ID!
  name: String!
  plants: [Plant!]!
}

input CoreArchiveArticleInput {
  expectedVersion: Int!
  id: ID!
}

input CoreCreateArticleInput {
  code: String!
  id: ID!
  name: String!
}

input CoreCreateRoleInput {
  id: ID!
  name: String!
  permissions: [String!]!
}

input CoreDeleteRoleInput {
  expectedVersion: Int!
  id: ID!
}

input CoreRestoreArticleInput {
  expectedVersion: Int!
  id: ID!
}

input CoreUpdateArticleInput {
  code: String!
  expectedVersion: Int!
  id: ID!
  name: String!
}

input CoreUpdateRoleInput {
  expectedVersion: Int!
  id: ID!
  name: String!
  permissions: [String!]!
  reason: String
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type EffectivePermission {
  grantedBy: [RoleAssignment!]!
  permission: Permission!
}

type Mutation {
  coreArchiveArticle(input: CoreArchiveArticleInput!): Article!
  coreCreateArticle(input: CoreCreateArticleInput!): Article!
  coreCreateRole(input: CoreCreateRoleInput!): Role!
  coreDeleteRole(input: CoreDeleteRoleInput!): Role!
  coreRestoreArticle(input: CoreRestoreArticleInput!): Article!
  coreUpdateArticle(input: CoreUpdateArticleInput!): Article!
  coreUpdateRole(input: CoreUpdateRoleInput!): Role!
  planningReleaseProductionOrder(input: PlanningReleaseProductionOrderInput!): ProductionOrder!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Permission {
  action: String!
  installed: Boolean!
  key: String!
  moduleId: String!
  resource: String!
}

type PermissionModule {
  moduleId: String!
  resources: [PermissionResource!]!
}

type PermissionResource {
  permissions: [Permission!]!
  resource: String!
}

input PlanningReleaseProductionOrderInput {
  expectedVersion: Int!
  id: ID!
}

type Plant {
  id: ID!
  name: String!
  slug: String!
}

type ProductionOrder {
  article: Article
  id: ID!
  number: String!
  quantity: String!
  status: String!
  version: Int!
}

type Query {
  coreArticle(id: ID!): Article
  coreArticles(after: String, before: String, first: Int = 25, includeArchived: Boolean = false, last: Int, orderBy: [ArticleOrderBy!], search: String): ArticleConnection!
  coreCompanies: [Company!]!
  corePermissionCatalog: [PermissionModule!]!
  coreRole(id: ID!): Role
  coreRoles: [Role!]!
  coreUser(id: ID!): User
  coreUsers(after: String, before: String, first: Int = 25, last: Int, orderBy: [UserOrderBy!], search: String): UserConnection!
  planningProductionOrders: [ProductionOrder!]!
}

type Role {
  holders: [RoleAssignment!]!
  id: ID!
  key: String!
  moduleId: String
  name: String!
  origin: RoleOrigin!
  permissions: [String!]!
  version: Int!
}

type RoleAssignment {
  id: ID!
  role: Role
  scope: AccessScope!
  user: User!
}

enum RoleOrigin {
  CUSTOM
  MODULE
}

enum ScopeKind {
  COMPANY
  PLANT
}

enum SortDirection {
  ASC
  DESC
}

type User {
  blocked: Boolean!
  effectivePermissions: [EffectivePermission!]!
  id: ID!
  name: String!
  roleAssignments: [RoleAssignment!]!
  username: String!
}

type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type UserEdge {
  cursor: String!
  node: User!
}

input UserOrderBy {
  direction: SortDirection = ASC
  field: UserSortField!
}

enum UserSortField {
  NAME
  USERNAME
}
