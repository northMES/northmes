name: Bug report
description: Something in NorthMES does not work as it should.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. Report it privately as [SECURITY.md](https://github.com/northMES/northmes/blob/main/SECURITY.md) describes, never in a public issue.

        Leave out personal data, customer names, order numbers and secrets from everything you paste below.
  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I searched the existing issues and found none for this bug.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, with any error message and its correlation id.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from a known state, for example a fresh install with the demo seed.
      placeholder: |
        1. Sign in as ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NorthMES version or commit
      description: The release, for example 0.0.1, or the commit SHA you run.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you run NorthMES (Docker Compose bundle or `pnpm dev`), the operating system and, for a problem in the web app, the browser and its version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, if you have them. They are shown as code.
      render: text
