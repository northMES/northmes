name: Feature request
description: Ask for a new feature or a change to how NorthMES works.
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Leave out personal data, customer names, order numbers and secrets from everything you write below.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, who does it, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What NorthMES should do instead.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve the problem that you considered, and why you prefer the proposed change.
