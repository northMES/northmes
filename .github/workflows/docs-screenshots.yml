# Regenerates the screenshots in apps/docs/images (ADR 0048). Start it from the Actions tab on the
# branch whose images should change, then download the docs-images artifact, unpack it over
# apps/docs/images and commit the PNGs. The job only reads the repository: a commit pushed with its
# token would start no CI run, so the required checks of that commit would never report.
name: Docs screenshots

on:
  workflow_dispatch:

permissions: {}

jobs:
  docs-screenshots:
    name: docs screenshots
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:screenshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-images
          path: apps/docs/images/
          if-no-files-found: error
