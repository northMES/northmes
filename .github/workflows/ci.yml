# The CI checks for pull requests and pushes to main. GitHub shows each job as CI / <job name>, so
# the job names do not repeat "ci". The main ruleset requires each job here as a status check by its
# job name, as docs/adr/0069-require-each-ci-job-as-a-status-check-on-main.md decides, so a renamed,
# added or removed job needs a ruleset edit: an added name after the merge, a removed or old name
# just before it. test/meta/workflows.test.ts lists the job names. Every job that CI / gate needs,
# except the two pull request checks, runs root pnpm scripts that pnpm check or pnpm check:full
# contains; the coverage summary step of CI / test only copies a report into the job summary.
name: CI

on:
  # edited re-runs the pull request checks after a fix to the title or body.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# No job here needs more than reading the repository.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm gen --check

  typecheck:
    name: typecheck
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    name: build
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # One check covers all tests in both time zones: the UTC leg, then the Europe/Stockholm leg. The
  # Stockholm leg also runs after a failed UTC leg, so a failure that shows only in Stockholm reports
  # in the same run; it does not run when a failed install skipped the UTC leg. The UTC leg collects
  # coverage, which is information only: after a passed UTC leg its summary goes to the job summary
  # and the lcov report is kept as an artifact.
  test:
    name: test
    permissions:
      contents: read
    # Blacksmith through NM_RUNNER_X64 for branches in this repository and main; a GitHub-hosted
    # runner for pull requests from forks and while the variable is unset.
    runs-on: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
          && 'ubuntu-24.04'
          || vars.NM_RUNNER_X64 || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - id: utc
        run: pnpm test:coverage
        env:
          TZ: UTC
          NM_TEST_PG_TZ: UTC
      - run: node scripts/ci/coverage-summary.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/lcov-report/
          if-no-files-found: error
      - if: "!cancelled() && steps.utc.outcome != 'skipped'"
        run: pnpm test:tz

  # The pull request checks read the event, so they run only for pull requests. Their scripts take
  # the event values from environment variables: interpolated into a run script, a title or body
  # could inject shell code.
  pr-title:
    name: pr title
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node scripts/ci/pr-title.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  # Renovate and release pull requests finish no issue and are exempt.
  linked-issue:
    name: linked issue
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node scripts/ci/linked-issue.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}

  # GitHub skips a job when a job it needs failed, and a skipped required check counts as passed,
  # so CI / gate always runs and fails itself instead. On a pull request every job it needs runs,
  # so a skipped one fails it too; a push to main skips only the pull request checks.
  gate:
    name: gate
    # The gate reads only the results of the jobs it needs, so its token gets no permissions.
    permissions: {}
    if: always()
    needs: [lint, typecheck, build, test, pr-title, linked-issue]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when a job that CI / gate needs did not pass
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (github.event_name == 'pull_request' && contains(needs.*.result, 'skipped'))
        run: exit 1
