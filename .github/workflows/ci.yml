# The CI checks for pull requests and pushes to main. GitHub shows each job as CI / <job name>, so
# the job names do not repeat "ci". The main ruleset requires each job here except CI / cla as a
# status check by its job name, as docs/adr/0069-require-each-ci-job-as-a-status-check-on-main.md
# decides, so a renamed, added or removed job needs a ruleset edit: an added name after the merge,
# a removed or old name just before it. test/meta/workflows.test.ts lists the job names. CI / cla
# joins CI / gate and the ruleset before the first outside pull request (ADR 0039). Every job that
# CI / gate needs, except the pull request checks and react doctor, runs root pnpm scripts that
# pnpm check or pnpm check:full contains; the coverage summary step of CI / test only copies a
# report into the job summary, and the git worktree add step of CI / fresh worktree only adds the
# directory that the job's later steps run in.
name: CI

on:
  # edited re-runs the pull request checks after a fix to the title or body.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# No job here needs more than reading the repository.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm gen --check

  typecheck:
    name: typecheck
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    name: build
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # One check covers all tests in both time zones: the UTC leg, then the Europe/Stockholm leg. The
  # Stockholm leg also runs after a failed UTC leg, so a failure that shows only in Stockholm reports
  # in the same run; it does not run when a failed install skipped the UTC leg. The UTC leg collects
  # coverage, which is information only: after a passed UTC leg its summary goes to the job summary
  # and the lcov report is kept as an artifact.
  test:
    name: test
    permissions:
      contents: read
    # Blacksmith through NM_RUNNER_X64 for branches in this repository and main; a GitHub-hosted
    # runner for pull requests from forks and while the variable is unset.
    runs-on: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
          && 'ubuntu-24.04'
          || vars.NM_RUNNER_X64 || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - id: utc
        run: pnpm test:coverage
        env:
          TZ: UTC
          NM_TEST_PG_TZ: UTC
      - run: node scripts/ci/coverage-summary.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/lcov-report/
          if-no-files-found: error
          overwrite: true
      - if: "!cancelled() && steps.utc.outcome != 'skipped'"
        run: pnpm test:tz

  # react-doctor runs in CI only, under the reviewed license exception in
  # docs/adr/0040-dependency-license-policy-ci-gate-and-sbom.md, so neither pnpm check nor pnpm
  # check:full runs it. The root script scans apps/web and packages/web-sdk.
  # --no-telemetry skips react-doctor's score API, share URL and crash reports, and
  # --no-supply-chain skips its Socket.dev lookup of each dependency, which the supply-chain checks
  # of docs/adr/0050-github-organization-rulesets-ci-runners-and-supply-chain.md cover. An error
  # fails the scan. With --json, react-doctor writes only its report, react-doctor-report.json, so
  # the next step copies the findings into the job summary and the log; it also runs after a failed
  # scan, and not when a failed install skipped the scan.
  react-doctor:
    name: react doctor
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - id: scan
        run: pnpm react-doctor
      - if: "!cancelled() && steps.scan.outcome != 'skipped'"
        run: pnpm react-doctor:summary

  # A handoff run starts in a fresh git worktree and runs tests right after one install, with no
  # build step, as
  # docs/adr/0058-developer-environment-source-exports-one-stack-script-and-one-gate-command.md
  # decides. The job adds a worktree beside the checkout, installs in it and runs the integration
  # project there; tests that boot the built server build it through bootBuilt. It runs on pull
  # requests only, because on main CI / test runs the same integration tests.
  fresh-worktree:
    name: fresh worktree
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    # The runner of CI / test, which every job that runs Vitest takes.
    runs-on: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
          && 'ubuntu-24.04'
          || vars.NM_RUNNER_X64 || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: git worktree add --detach ../fresh-worktree
      - run: pnpm install --frozen-lockfile
        working-directory: ../fresh-worktree
      - run: pnpm test:int
        working-directory: ../fresh-worktree

  # The pull request checks read the event, so they run only for pull requests. Their scripts take
  # the event values from environment variables: interpolated into a run script, a title or body
  # could inject shell code.
  # The end-to-end specs under e2e/ (docs/adr/0041-test-strategy-tdd-vitest-projects-testcontainers-and-playwright.md):
  # pnpm e2e builds, installs Chromium and runs Playwright, whose global setup starts Postgres
  # through Testcontainers and whose workers each spawn the built server in role all. After a
  # failed run, Playwright's report with the traces of the failed tests is kept as an artifact.
  e2e:
    name: e2e
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          overwrite: true

  pr-title:
    name: pr title
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node scripts/ci/pr-title.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  # Renovate and release pull requests finish no issue and are exempt.
  linked-issue:
    name: linked issue
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node scripts/ci/linked-issue.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}

  # ADR 0076: every pull request body has a Security note, filled in.
  pr-security:
    name: pr security
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node scripts/ci/pr-security.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}

  # AGENTS.md: a feat, fix or security pull request that changes source changes a test, and a
  # pull request that deletes a test says why under ## Removed tests.
  pr-tests:
    name: pr tests
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node scripts/ci/pr-tests.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}

  # ADR 0064: a pull request that breaks the public API fails, unless NorthMES is still 0.x and the
  # title marks the break with !. oasdiff compares the base branch's schema/openapi-v1.json with the
  # pull request's from its image pinned by digest, without network, so neither document leaves the
  # runner; Renovate updates OASDIFF_IMAGE's tag and digest together. scripts/ci/openapi-diff.mjs
  # decides from what oasdiff finds, and passes when the base branch has no document yet.
  openapi-diff:
    name: openapi diff
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      OASDIFF_IMAGE: tufin/oasdiff:v1.33.0@sha256:6263a96dd2ef0726c54e21fea9b8e1607eac4841add0079324b424c1f52b819c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the base branch's OpenAPI document
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: schema
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Compare the documents with oasdiff
        run: |
          if [ -f base/schema/openapi-v1.json ]; then
            docker run --rm --network none -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
              "$OASDIFF_IMAGE" breaking base/schema/openapi-v1.json schema/openapi-v1.json \
              --format json > "$RUNNER_TEMP/openapi-changes.json"
          fi
      - run: node scripts/ci/openapi-diff.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          OPENAPI_CHANGES: ${{ runner.temp }}/openapi-changes.json

  # ADR 0039: the pull request author and every commit author signed the contributor license
  # agreement. The job checks out nothing and runs scripts/cla/check.mjs from the default branch,
  # which reads .github/cla/signed.json from there too, so a pull request can neither change the
  # check nor sign for its own author. CI / gate does not need it yet; it joins the gate, and the
  # main ruleset, before the first outside pull request.
  cla:
    name: cla
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Download the CLA check from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p "$RUNNER_TEMP/cla/scripts/cla" "$RUNNER_TEMP/cla/scripts/ci"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/scripts/cla/check.mjs?ref=$DEFAULT_BRANCH" \
            > "$RUNNER_TEMP/cla/scripts/cla/check.mjs"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/scripts/ci/annotation.mjs?ref=$DEFAULT_BRANCH" \
            > "$RUNNER_TEMP/cla/scripts/ci/annotation.mjs"
      - name: Check that every author signed the CLA
        run: node "$RUNNER_TEMP/cla/scripts/cla/check.mjs"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # GitHub skips a job when a job it needs failed, and a skipped required check counts as passed,
  # so CI / gate always runs and fails itself instead. On a pull request every job it needs runs,
  # so a skipped one fails it too; a push to main skips only the pull request checks and
  # CI / fresh worktree.
  gate:
    name: gate
    # The gate reads only the results of the jobs it needs, so its token gets no permissions.
    permissions: {}
    if: always()
    needs: [lint, typecheck, build, test, react-doctor, fresh-worktree, e2e, pr-title, linked-issue, pr-security, pr-tests, openapi-diff]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when a job that CI / gate needs did not pass
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (github.event_name == 'pull_request' && contains(needs.*.result, 'skipped'))
        run: exit 1
