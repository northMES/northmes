# OpenSSF Scorecard (docs/adr/0050-github-organization-rulesets-ci-runners-and-supply-chain.md):
# scores the repository's supply-chain practices, uploads the findings to code scanning and
# publishes the score behind the README badge. Scorecard refuses to publish from a workflow with
# workflow-level write permissions, env or defaults, so this file has none, and its one job raises
# only what publishing needs.
name: Scorecard

on:
  # A change to the branch protection changes the score.
  branch_protection_rule:
  # Weekly, so the published score and the badge stay current.
  schedule:
    - cron: '27 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The SARIF upload to code scanning.
      security-events: write
      # Publishing the results to the OpenSSF API, which the badge reads.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # A fine-grained token with Administration: read lets Scorecard read the rulesets of
          # ADR 0050, which the default token cannot; without it the score falls back to the
          # default token and the Branch-Protection check reads less.
          repo_token: ${{ secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
