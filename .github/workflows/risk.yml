# The risk gate (ADR 0086). It sorts each pull request into a low or a high tier by how much harm a
# wrong merge would do, labels it risk:low or risk:high, and fails a high pull request until the
# maintainer approves its head commit. A review starts a new run, and Risk refresh re-runs the
# earlier ones (risk-refresh.yml), so an approval turns the required check green. The job
# downloads the check and .github/risk-paths from the default branch and runs them without a
# checkout, as CI / cla does, so a pull request cannot change the script or the paths that judge it.
# GitHub runs a pull request's own copy of this file, though, so the file itself is protected only
# by being a risk path: a change to .github/ needs the maintainer's approval.
name: Risk

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, dismissed]

# One run at a time per pull request; the latest event wins, so a stale label does not stay.
concurrency:
  group: risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  risk-gate:
    name: risk gate
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      tier: ${{ steps.risk.outputs.tier }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Download the risk gate from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p "$RUNNER_TEMP/risk/scripts/ci"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/scripts/ci/risk-gate.mjs?ref=$DEFAULT_BRANCH" \
            > "$RUNNER_TEMP/risk/scripts/ci/risk-gate.mjs"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/scripts/ci/pull-request.mjs?ref=$DEFAULT_BRANCH" \
            > "$RUNNER_TEMP/risk/scripts/ci/pull-request.mjs"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/scripts/ci/annotation.mjs?ref=$DEFAULT_BRANCH" \
            > "$RUNNER_TEMP/risk/scripts/ci/annotation.mjs"
      - name: Sort the pull request into a tier
        id: risk
        run: node "$RUNNER_TEMP/risk/scripts/ci/risk-gate.mjs"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # Only this job holds the write token. A pull request from a fork gets a read-only token, and a
  # label that does not exist yet fails gh pr edit, so the step warns instead of failing.
  risk-label:
    name: risk label
    needs: risk-gate
    if: always() && needs.risk-gate.outputs.tier != ''
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Label the pull request with its tier
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TIER: ${{ needs.risk-gate.outputs.tier }}
        run: |
          other=low
          if [ "$TIER" = low ]; then other=high; fi
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --add-label "risk:$TIER" --remove-label "risk:$other" \
            || echo "::warning::Could not label the pull request risk:$TIER."
