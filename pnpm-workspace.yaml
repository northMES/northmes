  '@testcontainers/postgresql': 12.1.0
  '@types/node': 26.6.2
  '@types/pg': 8.23.1
  '@vitejs/plugin-react': 6.1.1
  happy-dom: 20.14.5
  pg: 8.23.0
  turbo: 2.11.2
  typescript: 6.0.3
  vitest: 5.0.1
  yaml: 2.9.1
