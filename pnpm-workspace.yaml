packages:
  - apps/*
  - modules/*/contracts
  - modules/planning/domain
  - packages/*
  - examples/*

pmOnFail: ignore

allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false

catalogMode: strict

# 14 days in minutes. Transitive ranges resolve only to versions outside Renovate's
# minimumReleaseAge window, as the catalog pins do.
minimumReleaseAge: 20160

catalog:
  '@apollo/client': 4.3.1
  '@base-ui/react': 1.8.0
  '@biomejs/biome': 2.5.14
  '@fontsource/ibm-plex-mono': 5.3.0
  '@fontsource/ibm-plex-sans': 5.3.0
  '@hookform/resolvers': 5.9.1
  '@nestjs/common': 12.1.0
  '@nestjs/config': 12.0.1
  '@nestjs/core': 12.1.0
  '@nestjs/graphql': 14.0.2
  '@nestjs/platform-express': 12.1.0
  '@nestjs/terminus': 12.1.0
  '@nestjs/testing': 12.1.0
  '@playwright/test': 1.63.0
  '@tailwindcss/vite': 4.3.3
  '@tanstack/react-router': 1.170.39
  '@tanstack/react-table': 9.2.4
  '@testcontainers/postgresql': 12.1.0
  '@testing-library/dom': 10.4.2
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.7
  '@types/culori': 4.0.1
  '@types/express': 5.0.6
  '@types/ms': 2.1.0
  '@types/node': 26.6.2
  '@types/pg': 8.23.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/semver': 7.8.0
  '@types/ws': 8.18.1
  '@vitejs/plugin-react': 6.1.1
  '@vitest/coverage-v8': 5.0.1
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  culori: 4.0.2
  dataloader: 2.2.3
  fast-check: 4.10.2
  graphql: 16.14.2
  graphql-subscriptions: 3.0.0
  graphql-ws: 6.2.2
  graphql-yoga: 5.24.1
  happy-dom: 20.14.5
  kysely: 0.29.6
  lucide-react: 1.48.0
  ms: 2.1.3
  pg: 8.23.0
  react: 19.3.0
  react-doctor: 0.9.14
  react-dom: 19.3.0
  react-hook-form: 7.88.0
  reflect-metadata: 0.2.2
  rolldown: 1.2.10
  rxjs: 7.8.2
  semver: 7.8.5
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  temporal-polyfill: 1.0.5
  turbo: 2.11.2
  typescript: 6.0.3
  uuid: 14.0.2
  vite: 8.3.0
  vitest: 5.0.1
  ws: 8.21.3
  yaml: 2.9.1
  zod: 4.6.5

# React, the router, Apollo Client and graphql resolve to one copy each, also where a dependency's
# own range would pick another version: two copies of one of them in the web bundle or the backend
# break hooks, context and instanceof checks.
overrides:
  '@apollo/client': 'catalog:'
  '@tanstack/react-router': 'catalog:'
  graphql: 'catalog:'
  react: 'catalog:'
  react-dom: 'catalog:'
