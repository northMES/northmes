packages:
  - apps/*
  - modules/*
  - modules/*/contracts
  - modules/*/web
  - modules/planning/domain
  - packages/*
  - examples/*

pmOnFail: ignore

allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false

catalogMode: strict

catalog:
